[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trace2api"
version = "0.0.1"
description = "Turn observed browser network workflows into clean, reusable direct HTTP client code."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Tomislav Gregovic" }]
keywords = ["har", "http", "api", "codegen", "capture", "replay"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/TomislavGreg/Trace2API"
Source = "https://github.com/TomislavGreg/Trace2API"

[project.scripts]
trace2api = "trace2api.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/trace2api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
